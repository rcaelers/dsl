[package]
name = "logic-analyzer-app-native"
version.workspace = true
edition = "2024"
authors = ["Rob Caelers <rob.caelers@gmail.com>"]

[[bin]]
name = "logic-conduit"
path = "src/main.rs"

[[bin]]
name = "u3pro16-hardware-validation"
path = "src/bin/u3pro16-hardware-validation/main.rs"
required-features = ["developer-tools"]
test = false
bench = false

[[bin]]
name = "sigrok-upstream-validation"
path = "src/bin/sigrok-upstream-validation/main.rs"
required-features = ["developer-tools"]
test = false
bench = false

[dependencies]
blake3 = { workspace = true }
clap = { workspace = true }
crossbeam-channel = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
input-bindings = { path = "../input_bindings" }
logic-analyzer-capture-export = { path = "../logic_analyzer_capture_export" }
logic-analyzer-capture-formats = { path = "../logic_analyzer_capture_formats" }
logic-analyzer-device-dslogic = { path = "../logic_analyzer_device_dslogic" }
logic-analyzer-protocol-decoders = { path = "../logic_analyzer_protocol_decoders" }
logic-analyzer-ui = { path = "../logic_analyzer_ui" }
logic-analyzer-graph-nodes = { path = "../logic_analyzer_graph_nodes" }
logic-analyzer-graph-runtime = { path = "../logic_analyzer_graph_runtime" }
platform = { path = "../platform" }
node-graph = { path = "../widgets/node_graph" }
pyo3 = { workspace = true }
signal-capture = { path = "../signal_capture" }
signal-derived = { path = "../signal_derived" }
signal-capture-session = { path = "../signal_capture_session" }
signal-runtime = { path = "../signal_runtime" }
signal-sinks = { path = "../signal_sinks" }
platform-runtime = { path = "../platform_runtime" }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing-subscriber = { workspace = true }
example-plugin = { path = "../../plugins/example-plugin", optional = true }

[features]
developer-tools = ["logic-analyzer-device-dslogic/developer-tools"]
example-plugin = ["dep:example-plugin"]


[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSMenu", "NSMenuItem", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
