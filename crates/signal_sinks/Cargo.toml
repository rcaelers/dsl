[package]
name = "signal-sinks"
version.workspace = true
edition = "2024"
authors = ["Rob Caelers <rob.caelers@gmail.com>"]
description = "Portable terminal consumers and output encodings for signal streams"
repository = "https://github.com/rcaelers/logic-conduit"
license = "MIT"

[lib]
name = "signal_sinks"
path = "src/lib.rs"

[dependencies]
signal-capture = { path = "../signal_capture" }
signal-derived = { path = "../signal_derived" }
signal-runtime = { path = "../signal_runtime" }
crossbeam-channel = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
