[package]
name = "logic-analyzer-device-dslogic"
version.workspace = true
edition = "2024"
authors = ["Rob Caelers <rob.caelers@gmail.com>"]
description = "DSLogic U3Pro16 acquisition protocol and processing source"
repository = "https://github.com/rcaelers/logic-conduit"
license = "MIT"

[lib]
name = "logic_analyzer_device_dslogic"
path = "src/lib.rs"

[features]
developer-tools = []

[dependencies]
logic-analyzer-acquisition = { path = "../logic_analyzer_acquisition" }
platform-artifacts = { path = "../platform_artifacts" }
platform-runtime = { path = "../platform_runtime" }
signal-capture-session = { path = "../signal_capture_session" }
signal-capture = { path = "../signal_capture" }
logic-analyzer-trigger = { path = "../logic_analyzer_trigger" }
signal-runtime = { path = "../signal_runtime" }
crossbeam-channel = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
