[package]
name = "signal-derived"
version.workspace = true
edition = "2024"
authors = ["Rob Caelers <rob.caelers@gmail.com>"]
description = "Generic derived-signal payload, collection, indexing, and storage"
repository = "https://github.com/rcaelers/logic-conduit"
license = "MIT"

[lib]
name = "signal_derived"
path = "src/lib.rs"

[[bin]]
name = "derived-word-store-bench"
path = "src/bin/derived-word-store-bench/main.rs"
test = false
bench = false

[dependencies]
blake3 = { workspace = true }
crossbeam-channel = { workspace = true }
platform-artifacts = { path = "../platform_artifacts" }
platform-runtime = { path = "../platform_runtime" }
signal-capture = { path = "../signal_capture" }
signal-runtime = { path = "../signal_runtime" }
thiserror = { workspace = true }
tracing = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
