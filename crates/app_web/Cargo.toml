[package]
name = "logic-analyzer-app-web"
version.workspace = true
edition = "2024"
authors = ["Rob Caelers <rob.caelers@gmail.com>"]

[lib]
name = "logic_conduit"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { workspace = true }
log = { workspace = true }
logic-analyzer-ui = { path = "../logic_analyzer_ui" }
logic-analyzer-graph-nodes = { path = "../logic_analyzer_graph_nodes" }
logic-analyzer-graph-orchestration = { path = "../logic_analyzer_graph_orchestration" }
logic-analyzer-graph-runtime = { path = "../logic_analyzer_graph_runtime" }
logic-analyzer-processing = { path = "../logic_analyzer_processing" }
logic-analyzer-platform = { path = "../logic_analyzer_platform" }
node-graph = { path = "../widgets/node_graph" }
serde_json = { workspace = true }
signal-artifacts = { path = "../signal_artifacts" }
signal-derived = { path = "../signal_derived" }
signal-runtime = { path = "../signal_runtime" }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }
example-plugin = { path = "../../plugins/example-plugin", optional = true }

[features]
example-plugin = ["dep:example-plugin"]

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
