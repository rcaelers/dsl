[package]
name = "logic-analyzer-capture-formats"
version.workspace = true
edition = "2024"
authors = ["Rob Caelers <rob.caelers@gmail.com>"]
description = "Portable DSL and Sigrok capture-format readers and replay sources"
repository = "https://github.com/rcaelers/logic-conduit"
license = "MIT"

[lib]
name = "logic_analyzer_capture_formats"
path = "src/lib.rs"

[dependencies]
platform-artifacts = { path = "../platform_artifacts" }
platform-runtime = { path = "../platform_runtime" }
signal-capture-session = { path = "../signal_capture_session" }
signal-capture = { path = "../signal_capture" }
signal-generators = { path = "../signal_generators" }
signal-runtime = { path = "../signal_runtime" }
blake3 = { workspace = true }
crossbeam-channel = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
