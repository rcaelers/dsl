[package]
name = "logic-analyzer-app-web"
version.workspace = true
edition = "2024"
authors = ["Rob Caelers <rob.caelers@gmail.com>"]

[lib]
name = "logic_conduit"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3 = { workspace = true }
console_error_panic_hook = "0.1.7"
eframe = { workspace = true }
js-sys = { workspace = true }
log = { workspace = true }
logic-analyzer-capture-formats = { path = "../logic_analyzer_capture_formats" }
logic-analyzer-ui = { path = "../logic_analyzer_ui" }
logic-analyzer-graph-nodes = { path = "../logic_analyzer_graph_nodes" }
logic-analyzer-graph-orchestration = { path = "../logic_analyzer_graph_orchestration" }
logic-analyzer-graph-runtime = { path = "../logic_analyzer_graph_runtime" }
platform = { path = "../platform" }
node-graph = { path = "../widgets/node_graph" }
rfd = { workspace = true, features = ["file-handle-inner"] }
serde = { workspace = true }
serde_json = { workspace = true }
platform-artifacts = { path = "../platform_artifacts" }
platform-runtime = { path = "../platform_runtime" }
signal-capture = { path = "../signal_capture" }
signal-capture-session = { path = "../signal_capture_session" }
signal-derived = { path = "../signal_derived" }
signal-generators = { path = "../signal_generators" }
signal-runtime = { path = "../signal_runtime" }
signal-sinks = { path = "../signal_sinks" }
tracing = { workspace = true }
thiserror = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }
example-plugin = { path = "../../plugins/example-plugin", optional = true }

[features]
example-plugin = ["dep:example-plugin"]

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
zip = { workspace = true }
