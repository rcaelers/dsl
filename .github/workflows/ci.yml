name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.test_packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Discover independently tested crates
        id: test_packages
        run: |
          cargo metadata --no-deps --format-version 1 \
            | jq -c '.workspace_root as $root | [.packages[] | select(.manifest_path != ($root + "/Cargo.toml")) | .name]' \
            | sed 's/^/packages=/' >> "$GITHUB_OUTPUT"
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Check Rust module structure
        run: ruby scripts/check_rust_module_structure.rb
      - name: Check public function documentation
        run: ruby scripts/check_public_function_docs.rb
      - name: Test and check native/web platform boundaries
        run: |
          ruby scripts/check_platform_boundaries_test.rb
          ruby scripts/check_platform_boundaries.rb
      - name: Check UI processing boundary
        run: |
          if rg -n 'logic-analyzer-processing|logic_analyzer_processing' crates/logic_analyzer_ui; then
            echo 'logic_analyzer_ui must consume concrete processing behavior through logic_analyzer_graph'
            exit 1
          fi
      - name: Check architectural visibility
        env:
          RUSTFLAGS: -D unreachable-pub
        run: cargo check --workspace --all-targets
      - name: Build public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --lib

  test-crates:
    name: Test ${{ matrix.package }}
    needs: architecture
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.architecture.outputs.packages) }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Test crate in isolation
        run: cargo test -p ${{ matrix.package }}

  test-integration:
    needs: test-crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Test top-level integration package
        run: cargo test -p logic-analyzer-examples
      - name: Test native compile-time plugin linking
        run: cargo test -p logic-analyzer-app-native --features example-plugin

  clippy:
    needs: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Check all targets and features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  check-developer-tools:
    needs: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Check deterministic benchmark commands
        run: |
          cargo check -p signal-derived --bin derived-word-store-bench
          cargo check -p logic-analyzer-processing --features developer-tools --bin u3pro16-streaming-bench
          cargo check -p logic-analyzer-examples --bench compiler_capture
      - name: Check manual validation commands
        run: |
          cargo check -p logic-analyzer-platform --features developer-tools --bin u3pro16-hardware-validation
          cargo check -p logic-analyzer-platform --features developer-tools --bin sigrok-upstream-validation

  check-wasm:
    needs: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Check concrete processing targets
        env:
          RUSTFLAGS: -D unreachable-pub
        run: cargo check -p logic-analyzer-processing --target wasm32-unknown-unknown --all-targets --all-features
      - name: Install wasm test runner
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Test portable capture-node parity in wasm
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test -p logic-analyzer-graph-nodes --target wasm32-unknown-unknown --lib platform_parity_tests
      - name: Test portable storage in wasm
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          cargo test -p signal-artifacts --target wasm32-unknown-unknown --lib wasm_store_tests
          cargo test -p signal-derived --target wasm32-unknown-unknown --lib wasm_store_tests
      - name: Test browser artifact persistence in OPFS
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test -p logic-analyzer-platform --target wasm32-unknown-unknown --lib published_artifact_rehydrates_from_a_second_opfs_worker
      - name: Test browser capture-file import adapters
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test -p logic-analyzer-platform --target wasm32-unknown-unknown --lib web_file_import_tests
      - name: Test browser graph-document adapters
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test -p logic-analyzer-platform --target wasm32-unknown-unknown --lib web_document_tests
      - name: Test portable worker scheduling in wasm
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          cargo test -p signal-runtime --target wasm32-unknown-unknown --lib worker_operation_queue_tests
          cargo test -p signal-runtime --target wasm32-unknown-unknown --lib worker_messages_round_trip_as_owned_data
      - name: Build wasm UI with compile-time plugin constructors
        env:
          RUSTFLAGS: -D unreachable-pub
          WASM_APP_FEATURES: example-plugin
        run: scripts/build_wasm_app.sh
