[package]
name = "signal-capture"
version.workspace = true
edition = "2024"
authors = ["Rob Caelers <rob.caelers@gmail.com>"]
description = "Generic immutable signal capture, query, and finite waveform indexing"
repository = "https://github.com/rcaelers/logic-conduit"
license = "MIT"

[lib]
name = "signal_capture"
path = "src/lib.rs"

[dependencies]
blake3 = { workspace = true }
crossbeam-channel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
platform-artifacts = { path = "../platform_artifacts" }
platform-runtime = { path = "../platform_runtime" }
signal-runtime = { path = "../signal_runtime" }
thiserror = { workspace = true }
