[package]
name = "logic-analyzer-ui"
version.workspace = true
edition = "2024"
authors = ["Rob Caelers <rob.caelers@gmail.com>"]

[features]
default = []
native-host = [
    "dep:logic-analyzer-capture-export",
]

[lib]
name = "logic_analyzer_ui"
path = "src/lib.rs"

[dependencies]
input-bindings = { path = "../input_bindings" }
signal-processing = { path = "../signal_processing" }
logic-analyzer-graph-compiler = { path = "../logic_analyzer_graph_compiler" }
logic-analyzer-graph-api = { path = "../logic_analyzer_graph_api" }
logic-analyzer-viewer = { path = "../widgets/logic_analyzer_viewer" }
node-graph = { path = "../widgets/node_graph" }
panel-layout = { path = "../widgets/panel_layout" }
trigger-editor = { path = "../widgets/trigger_editor" }
eframe = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
crossbeam-channel = { workspace = true }
inventory = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
logic-analyzer-capture-export = { path = "../logic_analyzer_capture_export", optional = true }
tempfile = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
