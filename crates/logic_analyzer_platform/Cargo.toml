[package]
name = "logic-analyzer-platform"
version.workspace = true
edition = "2024"
authors = ["Rob Caelers <rob.caelers@gmail.com>"]

[features]
developer-tools = ["logic-analyzer-processing/developer-tools"]

[[bin]]
name = "u3pro16-hardware-validation"
path = "src/bin/u3pro16-hardware-validation/main.rs"
required-features = ["developer-tools"]
test = false
bench = false

[[bin]]
name = "sigrok-upstream-validation"
path = "src/bin/sigrok-upstream-validation/main.rs"
required-features = ["developer-tools"]
test = false
bench = false

[dependencies]
egui = { workspace = true }
input-bindings = { path = "../input_bindings" }
logic-analyzer-graph-compiler = { path = "../logic_analyzer_graph_compiler" }
logic-analyzer-graph-api = { path = "../logic_analyzer_graph_api" }
logic-analyzer-graph-nodes = { path = "../logic_analyzer_graph_nodes" }
logic-analyzer-processing = { path = "../logic_analyzer_processing" }
logic-analyzer-ui = { path = "../logic_analyzer_ui" }
node-graph = { path = "../widgets/node_graph" }
serde_json = { workspace = true }
serde = { workspace = true }
blake3 = { workspace = true }
signal-processing = { path = "../signal_processing" }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossbeam-channel = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
memmap2 = { workspace = true }
rfd = { workspace = true }
rusb = { workspace = true }
pyo3 = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    "Blob",
    "BlobPropertyBag",
    "ErrorEvent",
    "MessageEvent",
    "Url",
    "Worker",
    "WorkerOptions",
    "WorkerType",
] }
