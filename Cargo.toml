[workspace]
members = [".", "crates/app_native", "crates/app_web", "crates/input_bindings", "crates/logic_analyzer_capture_export", "crates/logic_analyzer_capture_formats", "crates/logic_analyzer_device_dslogic", "crates/logic_analyzer_graph_capabilities", "crates/logic_analyzer_graph_compiler", "crates/logic_analyzer_graph_editor_registry", "crates/logic_analyzer_graph_nodes", "crates/logic_analyzer_graph_orchestration", "crates/logic_analyzer_graph_plan", "crates/logic_analyzer_graph_registry", "crates/logic_analyzer_graph_runtime", "crates/logic_analyzer_protocol_decoders", "crates/node_graph_document", "crates/platform", "crates/logic_analyzer_test_support", "crates/logic_analyzer_ui", "crates/platform_artifacts", "crates/platform_runtime", "crates/signal_capture", "crates/signal_derived", "crates/signal_capture_session", "crates/signal_generators", "crates/signal_runtime", "crates/signal_sinks", "crates/signal_transforms", "crates/widgets/logic_analyzer_viewer", "crates/widgets/node_graph", "crates/widgets/panel_layout", "crates/widgets/trigger_editor", "crates/widgets/widget_support", "plugins/example-plugin"]
default-members = ["crates/app_native"]
resolver = "2"

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4.6.4", features = ["derive"] }
crossbeam-channel = "0.5.16"
dirs = "6.0.0"
eframe = { version = "0.35.0", features = ["persistence"] }
egui = "0.35.0"
lazy_static = "1.5.0"
libc = "0.2.189"
log = "0.4.33"
memmap2 = "0.9.11"
minifb = "0.28.0"
rfd = "0.17.2"
rusb = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
blake3 = "1.8.5"
tempfile = "3.27.0"
thiserror = "2.0.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wasm-bindgen = "=0.2.126"
wasm-bindgen-test = "0.3.76"
wasm-bindgen-futures = "0.4.58"
js-sys = "0.3.85"
web-sys = { version = "0.3.85", features = ["HtmlCanvasElement"] }
web-time = "1.1.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
inventory = "0.3.24"
pyo3 = "0.29.0"

[package]
name = "logic-analyzer-examples"
version.workspace = true
edition = "2024"
publish = false
autobins = false
autoexamples = false

# The graph-based examples live in graphs/. This is the sole standalone Rust
# example because it is a native framebuffer utility rather than a pipeline.
[[example]]
name = "ccd_viewer"
path = "examples/ccd_viewer.rs"

[[bench]]
name = "compiler_capture"
path = "benches/compiler_capture.rs"
harness = false

[[bin]]
name = "parallel-decoder-bench"
path = "src/bin/parallel-decoder-bench/main.rs"
test = false
bench = false

[[bin]]
name = "spi-decoder-bench"
path = "src/bin/spi-decoder-bench/main.rs"
test = false
bench = false

[[bin]]
name = "u3pro16-streaming-bench"
path = "src/bin/u3pro16-streaming-bench/main.rs"
required-features = ["developer-tools"]
test = false
bench = false

[features]
developer-tools = ["logic-analyzer-device-dslogic/developer-tools"]

[dependencies]
clap = { workspace = true }
crossbeam-channel = { workspace = true }
logic-analyzer-capture-formats = { path = "crates/logic_analyzer_capture_formats" }
logic-analyzer-device-dslogic = { path = "crates/logic_analyzer_device_dslogic" }
logic-analyzer-protocol-decoders = { path = "crates/logic_analyzer_protocol_decoders" }
memmap2 = { workspace = true }
minifb = { workspace = true }
platform-artifacts = { path = "crates/platform_artifacts" }
platform-runtime = { path = "crates/platform_runtime" }
signal-capture = { path = "crates/signal_capture" }
signal-derived = { path = "crates/signal_derived" }
signal-runtime = { path = "crates/signal_runtime" }
signal-sinks = { path = "crates/signal_sinks" }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
blake3 = { workspace = true }
egui = { workspace = true }
example-plugin = { path = "plugins/example-plugin" }
logic-analyzer-graph-capabilities = { path = "crates/logic_analyzer_graph_capabilities" }
logic-analyzer-graph-compiler = { path = "crates/logic_analyzer_graph_compiler" }
logic-analyzer-graph-orchestration = { path = "crates/logic_analyzer_graph_orchestration" }
logic-analyzer-graph-plan = { path = "crates/logic_analyzer_graph_plan" }
logic-analyzer-graph-registry = { path = "crates/logic_analyzer_graph_registry" }
logic-analyzer-graph-runtime = { path = "crates/logic_analyzer_graph_runtime" }
logic-analyzer-graph-nodes = { path = "crates/logic_analyzer_graph_nodes" }
platform = { path = "crates/platform", features = ["developer-tools"] }
logic-analyzer-ui = { path = "crates/logic_analyzer_ui" }
logic-analyzer-viewer = { path = "crates/widgets/logic_analyzer_viewer" }
node-graph = { path = "crates/widgets/node_graph" }
node-graph-document = { path = "crates/node_graph_document" }
signal-capture-session = { path = "crates/signal_capture_session" }
signal-generators = { path = "crates/signal_generators" }
signal-transforms = { path = "crates/signal_transforms" }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }

[profile.release]
debug = true
