[package]
name = "platform"
version.workspace = true
edition = "2024"
authors = ["Rob Caelers <rob.caelers@gmail.com>"]

[features]
developer-tools = []

[dependencies]
blake3 = { workspace = true }
platform-artifacts = { path = "../platform_artifacts" }
platform-runtime = { path = "../platform_runtime" }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossbeam-channel = { workspace = true }
memmap2 = { workspace = true }
rfd = { workspace = true }
rusb = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
rfd = { workspace = true, features = ["file-handle-inner"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "ErrorEvent",
    "HtmlAnchorElement",
    "HtmlElement",
    "MessageEvent",
    "Navigator",
    "Node",
    "StorageManager",
    "Url",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "Window",
] }

[dev-dependencies]
logic-analyzer-test-support = { path = "../logic_analyzer_test_support" }
wasm-bindgen-test = { workspace = true }
zip = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = { workspace = true }
