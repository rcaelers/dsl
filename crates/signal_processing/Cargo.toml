[package]
name = "signal-processing"
version.workspace = true
edition = "2024"
authors = ["Rob Caelers <rob.caelers@gmail.com>"]
description = "UI-independent streaming runtime and generic signal-processing infrastructure"
readme = "README.md"
repository = "https://github.com/rcaelers/logic-conduit"
license = "MIT"

[lib]
name = "signal_processing"
path = "src/lib.rs"

[[bin]]
name = "derived-word-store-bench"
path = "src/bin/derived-word-store-bench/main.rs"
test = false
bench = false

[dependencies]
thiserror = { workspace = true }
crossbeam-channel = { workspace = true }
tracing = { workspace = true }
lazy_static = { workspace = true }
web-time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.76"
